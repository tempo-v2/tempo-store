# Created by tempo-v2 bootstrap; package metadata stays standalone.
[package]
name = "tempo-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/tempo-v2/tempo-store"

[dependencies]
tempo-types = "=0.1.0"
tempo-study = "=0.1.0"
tempo-learning = "=0.1.0"
tempo-chess = "=0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "=1.8.3"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
log = { version = "0.4", features = ["kv"] }

[dev-dependencies]
rusqlite = { version = "=0.32.1", features = ["hooks"] }
tempfile = "=3.15.0"
